name: Telegram Auto Forwarder

on:
  schedule:
    - cron: '*/5 * * * *'  # প্রতি ৫ মিনিট পর পর ফরোয়ার্ড চেক করবে
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Forwarder Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MAIN_CHANNEL_ID: ${{ secrets.MAIN_CHANNEL_ID }}
          TARGET_CHANNELS: ${{ secrets.TARGET_CHANNELS }}
          FORWARD_DELAY: ${{ secrets.FORWARD_DELAY }}
        run: python bot.py

      - name: Commit & Push updated posted.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update forwarded history
          file_pattern: 'posted.json'
